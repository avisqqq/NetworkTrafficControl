version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - depguard
    - misspell
    - revive

  settings:
    revive:
      # The default set minus `exported`/`package-comments`: this is an
      # application, not a library, so doc comments are a judgement call.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        # Go initialisms: IpFilter -> IPFilter, etc.
        - name: var-naming

    depguard:
      # The dependency rule of the architecture, enforced by the compiler's
      # neighbour instead of by memory. See docs/architecture.md.
      rules:
        domain:
          files:
            - "**/source/domain/**"
          deny:
            - pkg: ntc/source/application
              desc: domain holds types and rules; it does not know the application
            - pkg: ntc/source/infrastructure
              desc: domain holds types and rules; it does not know any adapter
        application:
          files:
            - "**/source/application/**"
          deny:
            - pkg: ntc/source/infrastructure
              desc: application declares ports and consumes them; adapters are wired in main

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

issues:
  # Defaults are max-issues-per-linter: 50 and max-same-issues: 3, which hide
  # findings without saying so -- a gate that silently truncates reads as
  # "clean". Report everything.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt