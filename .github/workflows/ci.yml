name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l source/)
          if [ -n "$out" ]; then
            echo "These files are not gofmt'ed:"
            echo "$out"
            exit 1
          fi

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: vet
        run: go vet ./source/...

      - name: test
        run: go test -race ./source/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned: an unattended linter upgrade must not turn the build red on
      # its own. Bump deliberately, after running `make lint` locally.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2