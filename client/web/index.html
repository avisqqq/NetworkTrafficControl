<!doctype <html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width" , initial-scale=1" />
	<title>XDP Events</title>
	<link rel="stylesheet" href="./style.css" />
</head>

<body>
	<header class="top">
		<div class="container row">
			<div class="brand">
				<div class="title">XDP Event</div>
				<div class="title">SSE steam: /events</div>
			</div>

			<div class="spacer"></div>

			<div id="status" class="pill">Connecting...</div>
		</div>
		<div class="container toolbar row">
			<input id="filter" class="input" placeholder="Filter (ip / proto / seq)" />

			<button id="toggle" class="btn"> Pause</button>
			<button id="clear" class="btn btn-ghost">Clear</button>

			<div class="spacer"></div>

			<label class="meta row" style="gap:8px">
				<span>Max</span>
				<input id="cap" class="input input-small" value="300" />
			</label>

			<div class="meta">
				Rows: <span id="count">0</span>
			</div>
		</div>
	</header>

	<main class="container-split">
		<aside class="panel">
			<div class="card">
				<div class="row">
					<select id="listType" class="input">
						<option value="black">BlackList</option>
						<option value="white">WhiteList</option>
					</select>
				</div>

				<div class="row" style="margin-top:10px">
					<input id="ipInput" class="input" placeholder="IPv4 (e.g. 1.2.3.4)" required
						pattern="\d+\.\d+\.\d+\.\d+" />
				</div>

				<div class="row" style="margin-top:10px">
					<button id="addBtn" class="btn btn-success">Add</button>
					<button id="removeBtn" class="btn btn-danger">Remove</button>
					<button id="refreshBtn" class="btn btn-ghost">Refresh</button>
				</div>

				<div class="card" style="margin-top:10px">
					<div class="meta">Entires</div>
					<ul id="listEntries" class="list"></ul>
				</div>
			</div>
		</aside>
		<div class="card" style="flex:1">
			<table class="table">
				<thead>
					<tr>
						<th class="right"> seq</th>
						<th>proto</th>
						<th>Action</th>
						<th>src</th>
						<th>dst</th>
						<th class="right"> age</th>
					</tr>
				</thead>
				<tbody id="rows"></tbody>
			</table>
		</div>
	</main>

	<script src="./app.js"></script>
</body>

</html>
