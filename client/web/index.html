<!doctype html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Network Traffic Control</title>
	<link rel="stylesheet" href="./style.css" />
</head>

<body>
	<header class="top">
		<div class="container row">
			<div class="brand">
				<div class="title">Network Traffic Control</div>
				<div class="subtitle">TC ingress and egress packet stream</div>
			</div>

			<div class="spacer"></div>

			<div id="status" class="pill">Connecting...</div>
		</div>
		<div class="container toolbar row">
			<input id="filter" class="input" placeholder="Filter by IP, port, protocol, action, direction, or sequence" />

			<button id="toggle" class="btn"> Pause</button>
			<button id="clear" class="btn btn-ghost">Clear</button>

			<div class="spacer"></div>

			<label class="meta row" style="gap:8px">
				<span>Max</span>
				<input id="cap" class="input input-small" value="300" inputmode="numeric" />
			</label>

			<div class="meta">
				Rows: <span id="count">0</span>
			</div>
		</div>
	</header>

	<main class="container-split">
		<aside class="panel">
			<div class="card">
				<div class="row">
					<select id="listType" class="input">
						<option value="black">Blacklist</option>
						<option value="white">Whitelist</option>
					</select>
				</div>

				<div class="row" style="margin-top:10px">
					<input id="ipInput" class="input" placeholder="IPv4 or IPv6 address" required />
				</div>

				<div class="row" style="margin-top:10px">
					<button id="addBtn" class="btn btn-success">Add</button>
					<button id="removeBtn" class="btn btn-danger">Remove</button>
					<button id="refreshBtn" class="btn btn-ghost">Refresh</button>
				</div>

				<div class="list-panel" style="margin-top:10px">
					<div class="meta">Entries</div>
					<ul id="listEntries" class="list"></ul>
				</div>
			</div>
		</aside>
		<div class="events-panel">
			<table class="table">
				<thead>
					<tr>
						<th class="right">seq</th>
						<th>iface</th>
						<th>dir</th>
						<th>proto</th>
						<th>Action</th>
						<th>src</th>
						<th class="right">s-port</th>
						<th>dst</th>
						<th class="right">d-port</th>
						<th class="right">time</th>
					</tr>
				</thead>
				<tbody id="rows"></tbody>
			</table>
		</div>
	</main>

	<script src="./app.js"></script>
</body>

</html>
